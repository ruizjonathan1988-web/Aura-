name: aura
description: "Aura, le jeu de société du cinéma. Un jeu VJOD."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ">=3.6.1 <5.0.0"
  file_picker: ">=8.1.4 <11.0.0"
  flutter_local_notifications: 17.2.4
  flutter_svg: ^2.0.10
  http: ^1.2.2
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.6.0
  timezone: ^0.9.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/figurines/
    - assets/marque/
  # Polices embarquées : l'appli marche hors ligne sur la box, dès le premier
  # lancement (licence dans assets/polices/LICENCES.txt).
  fonts:
    - family: Anton
      fonts:
        - asset: assets/polices/Anton-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/polices/Nunito-Bold.ttf
          weight: 700
        - asset: assets/polices/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/polices/Nunito-Black.ttf
          weight: 900
