name: aura
description: "Aura, le jeu de société du cinéma. Un jeu VJOD."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.6.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/figurines/
    - assets/marque/
