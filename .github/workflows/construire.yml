name: Construire Aura

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Vérifier les secrets (sans les afficher)
        env:
          VJOD_SERVEUR: ${{ secrets.VJOD_SERVEUR }}
          TMDB_CLE: ${{ secrets.TMDB_CLE }}
        run: |
          ok=1
          case "$VJOD_SERVEUR" in
            https://*/jellyfin) echo "VJOD_SERVEUR : présent, bien formé" ;;
            "") echo "::error::Secret VJOD_SERVEUR absent"; ok=0 ;;
            *) echo "::error::VJOD_SERVEUR doit être seulement l'adresse, de la forme https://…/jellyfin, sans espace"; ok=0 ;;
          esac
          if printf '%s' "$TMDB_CLE" | grep -Eq '^[0-9a-f]{32}$'; then echo "TMDB_CLE : présente, bien formée"
          elif [ -z "$TMDB_CLE" ]; then echo "::error::Secret TMDB_CLE absent"; ok=0
          else echo "::error::TMDB_CLE doit être la clé seule (32 caractères 0-9 a-f), sans espace"; ok=0; fi
          [ "$ok" = 1 ]

      - name: Générer les dossiers Android et web
        run: |
          flutter create --platforms=android,web --org fr.vjod --project-name aura .
          rm -f test/widget_test.dart
          python3 tool/configurer_android.py

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      # Les écrans dessinés avec les vraies polices, pour relire l'interface
      # sans appareil. Ne fait jamais échouer la construction.
      - name: Captures d'écran
        continue-on-error: true
        run: flutter test captures/captures_test.dart --update-goldens

      # Les captures vont sur la branche « captures-ecrans » (lisible sans
      # téléchargement d'artefact).
      - name: Publier les captures
        continue-on-error: true
        run: |
          if ls captures/sorties/*.png > /dev/null 2>&1; then
            mkdir -p /tmp/cap && cp captures/sorties/*.png /tmp/cap/
            cd /tmp/cap
            git init -q
            git config user.name "aura-captures"
            git config user.email "aura-captures@users.noreply.github.com"
            git checkout -q -b captures-ecrans
            echo "${GITHUB_SHA}" > SOURCE
            git add -A
            git commit -qm "Captures de ${GITHUB_SHA}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" captures-ecrans
          fi

      - name: APK (télé et téléphone)
        run: |
          # Toujours la même signature, pour que chaque version s'installe par-dessus la précédente.
          mkdir -p ~/.android && cp tool/signature.keystore ~/.android/debug.keystore
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=VJOD_SERVEUR=${{ secrets.VJOD_SERVEUR }} \
            --dart-define=TMDB_CLE=${{ secrets.TMDB_CLE }}
          cp build/app/outputs/flutter-apk/app-release.apk aura.apk

      - name: Version web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=VJOD_SERVEUR=${{ secrets.VJOD_SERVEUR }} --dart-define=TMDB_CLE=${{ secrets.TMDB_CLE }}

      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: aura.apk

      # Aura lit « Ce qui change » sur la release pour sa fenêtre de mise à jour
      # (lib/services/mise_a_jour.dart) : le titre de la PR fusionnée.
      - name: Ce qui change
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          titre=$(printf '%s\n' "$MESSAGE" | head -n 1 | sed -E 's/ \(#[0-9]+\)$//')
          {
            echo "Aura, le jeu de société du cinéma. Un jeu VJOD."
            echo "Même APK pour la box Android TV et le téléphone. Les mises à jour s'installent depuis l'appli."
            echo
            echo "Ce qui change :"
            echo "- $titre"
          } > notes.md
          cat notes.md

      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere
          name: Aura, dernière version
          prerelease: true
          make_latest: true
          files: aura.apk
          body_path: notes.md

      - name: Mettre en ligne la version web
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
